<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16352b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Casa Nova ABC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: cabeçalho verde-escuro compacto, filtros em linha rolável + painel, fichas com foto grande (1 coluna no celular) */
:root{
  --bg:#f4f2ec; --surface:#ffffff; --ink:#18231f; --muted:#5f6b66; --line:#e1ddd2;
  --brand:#16352b; --brand-ink:#f4f2ec; --accent:#d9632b; --accent-ink:#ffffff;
  --chip:#ebe8dd; --chip-on:#16352b; --chip-on-ink:#f4f2ec;
  --ok:#17744f; --ok-bg:#dff1e7; --mid:#8a5a00; --mid-bg:#faecc8; --warn:#a1301f; --warn-bg:#f9ddd7;
  --photo:#d9d5c8; --shadow:0 1px 2px rgba(24,35,31,.06),0 6px 20px rgba(24,35,31,.06);
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1512; --surface:#16201c; --ink:#eaeee9; --muted:#9aa8a1; --line:#26332d;
  --brand:#0a100d; --brand-ink:#eaeee9; --accent:#f08a54; --accent-ink:#1a0e07;
  --chip:#1f2c26; --chip-on:#eaeee9; --chip-on-ink:#0e1512;
  --ok:#6fd1a2; --ok-bg:#12332a; --mid:#e8c36a; --mid-bg:#36290d; --warn:#f19a8b; --warn-bg:#3b1d18;
  --photo:#1f2a25; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--f)}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* cabeçalho */
.top{background:var(--brand);color:var(--brand-ink);padding-top:max(16px,env(safe-area-inset-top));padding-bottom:20px}
.top h1{margin:0;font-weight:800;font-size:clamp(24px,6vw,36px);letter-spacing:-.02em;line-height:1.1}
.top p{margin:6px 0 0;color:color-mix(in srgb,var(--brand-ink) 75%,transparent);font-size:14px;max-width:60ch}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stat{background:color-mix(in srgb,var(--brand-ink) 12%,transparent);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.stat b{font-weight:800}

/* barra de filtros */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top));padding-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:1;min-width:0;padding:2px 0}
.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:9px 14px;min-height:40px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.btn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;min-height:40px;font-weight:700;font-size:14px;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* painel de filtros */
.panel{display:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.panel.open{display:grid}
.panel label.l,.panel .l{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.panel .val{font-weight:800;color:var(--ink);letter-spacing:0;text-transform:none;font-size:15px}
input[type=range]{width:100%;height:32px;accent-color:var(--accent)}
select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.sw{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;font-weight:600}
.sw input{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* lista */
.count{margin:18px 0 12px;font-weight:700;color:var(--muted);font-size:14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding-bottom:40px}
.card{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.photo{position:relative;aspect-ratio:4/3;background:var(--photo);display:block}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600;font-size:14px}
.badge{position:absolute;left:10px;top:10px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.b-boa{background:var(--ok-bg);color:var(--ok)} .b-media{background:var(--mid-bg);color:var(--mid)} .b-atencao{background:var(--warn-bg);color:var(--warn)}
.stamp{position:absolute;right:10px;top:10px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;background:var(--ok);color:#fff}
.stamp.rec{background:var(--warn)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.act{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;cursor:pointer}
.act.yes{border-color:var(--ok);color:var(--ok)} .act.yes[aria-pressed="true"]{background:var(--ok);color:#fff}
.act.no{border-color:var(--warn);color:var(--warn)} .act.no[aria-pressed="true"]{background:var(--warn);color:#fff}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:700;cursor:pointer;padding:0 6px;font-size:13px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.send{display:none;position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:30;max-width:560px;margin:0 auto;box-shadow:0 8px 28px rgba(0,0,0,.28);background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 14px;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:700;font-size:14px}
.send.on{display:flex}
.send a{background:var(--accent-ink);color:var(--accent);text-decoration:none;font-weight:800;border-radius:10px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.price{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.m2{font-size:13px;font-weight:600;color:var(--muted)}
.where{font-weight:700;font-size:16px;line-height:1.3}
.where small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.specs{display:flex;gap:6px;flex-wrap:wrap}
.spec{background:var(--chip);border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px}
.note{margin:0;color:var(--muted);font-size:13px}
.go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 16px;min-height:48px;background:var(--brand);color:var(--brand-ink);text-decoration:none;font-weight:700;border-radius:12px}
.src{font-size:12px;font-weight:600;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border-radius:18px}
.foot{padding:8px 0 96px;color:var(--muted);font-size:13px;max-width:70ch}
@media (max-width:520px){.grid{grid-template-columns:1fr}.price{font-size:28px}.top p{font-size:13px}}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
.photo{cursor:zoom-in}
.photo .cnt{position:absolute;right:10px;bottom:10px;background:rgba(10,18,15,.72);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;pointer-events:none}
#lb{position:fixed;inset:0;z-index:50;background:rgba(8,12,10,.94);display:flex;flex-direction:column;color:#fff;touch-action:pan-y}
#lb[hidden]{display:none}
#lb .top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:700;font-size:14px}
#lb .x{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;width:40px;height:40px;font-size:20px;cursor:pointer}
#lb .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#lb .stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:99px;width:44px;height:44px;font-size:22px;cursor:pointer}
#lb .nav.p{left:10px}#lb .nav.n{right:10px}
#lb .thumbs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
#lb .thumbs img{height:54px;width:74px;object-fit:cover;border-radius:6px;opacity:.5;cursor:pointer;flex:none}
#lb .thumbs img.on{opacity:1;outline:2px solid #fff}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>Casa Nova ABC</h1>
  <p>Casas térreas até R$ 360 mil, com 2 quartos ou mais, em São Paulo, Santo André, Mauá e São Bernardo. Sem sobrado, geminada, condomínio nem dívida.</p>
  <div class="stats"><span class="stat" id="sCount"></span><span class="stat" id="sDate"></span></div>
</div></header>

<div class="bar"><div class="wrap">
  <div class="row">
    <div class="scroll" id="cidades" role="group" aria-label="Cidade"></div>
    <button class="btn" id="btnPanel" type="button" aria-expanded="false" aria-controls="panel">Filtros</button>
  </div>
  <div class="panel" id="panel">
    <div>
      <label class="l" for="preco">Preço máximo <span class="val" id="precoVal"></span></label>
      <input type="range" id="preco" min="150000" max="360000" step="5000" value="360000">
    </div>
    <div>
      <label class="l" for="ordem">Ordenar por</label>
      <select id="ordem">
        <option value="loc">Melhor localização</option>
        <option value="preco">Menor preço</option>
        <option value="m2">Menor preço por m²</option>
        <option value="area">Maior área</option>
        <option value="novo">Mais recentes</option>
      </select>
    </div>
    <div>
      <span class="l">Mostrar</span>
      <label class="sw"><input type="checkbox" id="ocultarAtencao" checked> Esconder bairros periféricos ou em morro</label>
      <label class="sw"><input type="checkbox" id="soTerreas"> Só térreas confirmadas (sem "tipo a confirmar")</label>
    </div>
  </div>
  <div class="seg" id="abas" role="group" aria-label="Situação">
    <button type="button" data-v="novas" aria-pressed="true">Para avaliar</button>
    <button type="button" data-v="aprovadas" aria-pressed="false">Aprovadas</button>
    <button type="button" data-v="recusadas" aria-pressed="false">Recusadas</button>
  </div>
  <div class="send" id="send"><span id="sendTxt"></span><a id="sendLink" target="_blank" rel="noopener">Enviar escolhas</a></div>
</div></div>

<main class="wrap">
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <p class="foot" id="foot"></p>
</main>

<div id="lb" hidden role="dialog" aria-modal="true" aria-label="Fotos do anúncio">
  <div class="top"><span id="lbN"></span><button class="x" type="button" id="lbX" aria-label="Fechar">✕</button></div>
  <div class="stage"><button class="nav p" type="button" id="lbP" aria-label="Foto anterior">‹</button><img id="lbI" alt=""><button class="nav n" type="button" id="lbF" aria-label="Próxima foto">›</button></div>
  <div class="thumbs" id="lbT"></div>
</div>
<script>
const brl = n => n == null ? "—" : n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const LOC = {boa:["Boa localização","b-boa",0], media:["Localização média","b-media",1], atencao:["Periférico ou morro","b-atencao",2]};
const BLOQ = /transfer[eê]ncia de d[ií]vida|financiamento em andamento|retomad|leil[aã]o|sobrado|geminad|condom[ií]nio/i;
const REPO = "Raiugami/casa-nova";
let dados = null, cidadesAtivas = new Set(), aba = "novas", remoto = {aprovadas:new Set(), recusadas:new Set()}, local = {};
const $ = id => document.getElementById(id);
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}
try{ local = JSON.parse(store("escolhas")||"{}"); }catch(e){}
// escolha efetiva: a do aparelho (se houver) vale sobre a do repositório
const doRepo = id => remoto.aprovadas.has(id) ? "aprovada" : remoto.recusadas.has(id) ? "recusada" : null;
const estado = id => (id in local) ? local[id] : doRepo(id);
function decidir(id, e){
  local[id] = estado(id) === e ? null : e;
  if(local[id] === doRepo(id)) delete local[id];
  store("escolhas", JSON.stringify(local)); render();
}
// escolhas ainda não enviadas ao repositório viram um pedido pré-preenchido no GitHub
function mostraEnvio(){
  const pend = Object.entries(local);
  const box = $("send"); box.classList.toggle("on", pend.length > 0);
  if(!pend.length) return;
  const lista = k => pend.filter(([,e]) => e === k).map(([id]) => id).join(",");
  const corpo = ["aprovar: " + lista("aprovada"), "recusar: " + lista("recusada"), "desfazer: " + pend.filter(([,e]) => e === null).map(([id]) => id).join(",")].join("\n");
  $("sendTxt").textContent = pend.length + (pend.length===1 ? " escolha ainda não enviada" : " escolhas ainda não enviadas");
  $("sendLink").href = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent("Escolhas: " + new Date().toLocaleString("pt-BR"))}&body=${encodeURIComponent(corpo)}`;
}

let fotos = {};
fetch("fotos.json?v=" + Date.now()).then(r => r.json()).then(f => { fotos = f; dados && render(); }).catch(() => {});
const listaFotos = i => (fotos[i.id] && fotos[i.id].length ? fotos[i.id] : (i.imagem ? [i.imagem] : []));
let lbL = [], lbK = 0;
function lbMostra(k){
  lbK = (k + lbL.length) % lbL.length;
  $("lbI").src = lbL[lbK]; $("lbN").textContent = (lbK+1) + " de " + lbL.length;
  [...$("lbT").children].forEach((t,n) => { t.classList.toggle("on", n===lbK); if(n===lbK) t.scrollIntoView({inline:"center",block:"nearest"}); });
  $("lbP").hidden = $("lbF").hidden = lbL.length < 2;
}
function lbAbre(i){
  lbL = listaFotos(i); if(!lbL.length) return;
  const t = $("lbT"); t.innerHTML = "";
  lbL.forEach((u,n) => { const im = new Image(); im.src = u; im.loading = "lazy"; im.referrerPolicy = "no-referrer"; im.alt = ""; im.onclick = () => lbMostra(n); t.appendChild(im); });
  t.hidden = lbL.length < 2; $("lb").hidden = false; document.body.style.overflow = "hidden"; lbMostra(0);
}
function lbFecha(){ $("lb").hidden = true; document.body.style.overflow = ""; $("lbI").removeAttribute("src"); }
$("lbI").referrerPolicy = "no-referrer";
$("lbX").onclick = lbFecha; $("lbP").onclick = () => lbMostra(lbK-1); $("lbF").onclick = () => lbMostra(lbK+1);
$("lb").addEventListener("click", e => { if(e.target.classList.contains("stage")) lbFecha(); });
document.addEventListener("keydown", e => { if($("lb").hidden) return; if(e.key==="Escape") lbFecha(); if(e.key==="ArrowLeft") lbMostra(lbK-1); if(e.key==="ArrowRight") lbMostra(lbK+1); });
let tx = null;
$("lb").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive:true});
$("lb").addEventListener("touchend", e => { if(tx===null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if(Math.abs(dx) > 50) lbMostra(lbK + (dx < 0 ? 1 : -1)); }, {passive:true});
async function carregar(){
  try{ dados = await (await fetch("imoveis.json?v=" + Date.now())).json(); }
  catch(e){ $("count").textContent = "Não foi possível carregar a lista de imóveis."; return; }
  try{
    const rd = await (await fetch("decisoes.json?v=" + Date.now())).json();
    remoto = {aprovadas:new Set(rd.aprovadas||[]), recusadas:new Set(rd.recusadas||[])};
    Object.keys(local).forEach(id => { if(local[id] === doRepo(id)) delete local[id]; });
    store("escolhas", JSON.stringify(local));
  }catch(e){}
  dados.imoveis = dados.imoveis.filter(i => !BLOQ.test([i.tipo,i.extras].join(" ")) && i.preco <= 360000 && i.quartos >= 2);
  $("sDate").textContent = "Atualizado em " + new Date(dados.atualizado_em + "T12:00:00").toLocaleDateString("pt-BR");
  $("foot").textContent = "Fontes: " + dados.fontes_consultadas.join(", ") + ". " + dados.observacao + " A classificação de localização é uma estimativa por nome de bairro.";
  const cidades = [...new Set(dados.imoveis.map(i=>i.cidade))].sort();
  const box = $("cidades");
  const todas = chip("Todas", () => { cidadesAtivas = new Set(cidades); sync(); render(); });
  box.appendChild(todas);
  cidades.forEach(c => box.appendChild(chip(c, () => {
    if(cidadesAtivas.size === cidades.length) cidadesAtivas = new Set([c]);
    else if(cidadesAtivas.has(c)) cidadesAtivas.delete(c); else cidadesAtivas.add(c);
    if(!cidadesAtivas.size) cidadesAtivas = new Set(cidades);
    sync(); render();
  })));
  cidadesAtivas = new Set(cidades);
  function sync(){ [...box.children].forEach((b,idx) => b.setAttribute("aria-pressed", idx===0 ? cidadesAtivas.size===cidades.length : cidadesAtivas.has(b.textContent) && cidadesAtivas.size!==cidades.length)); }
  window.__sync = sync; sync();
  const o = store("ordem"); if(o) $("ordem").value = o;
  render();
}
function chip(txt, fn){ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=txt; b.onclick=fn; return b; }

function render(){
  const max = +$("preco").value; $("precoVal").textContent = brl(max);
  const soT = $("soTerreas").checked, ocultar = $("ocultarAtencao").checked, ordem = $("ordem").value; store("ordem",ordem);
  let lista = dados.imoveis.filter(i => cidadesAtivas.has(i.cidade) && i.preco <= max && !(soT && /confirmar/i.test(i.tipo||"")) && !(ocultar && i.localizacao==="atencao" && aba==="novas") && ({novas:!estado(i.id), aprovadas:estado(i.id)==="aprovada", recusadas:estado(i.id)==="recusada"}[aba]));
  const m2 = i => i.area ? i.preco/i.area : Infinity;
  const S = {
    loc:(a,b)=>LOC[a.localizacao][2]-LOC[b.localizacao][2] || a.preco-b.preco,
    preco:(a,b)=>a.preco-b.preco, m2:(a,b)=>m2(a)-m2(b), area:(a,b)=>(b.area||0)-(a.area||0),
    novo:(a,b)=>(b.anuncio_data||"").localeCompare(a.anuncio_data||"")
  };
  lista.sort(S[ordem]);
  const n = lista.length;
  const SIT = {novas:i=>!estado(i.id), aprovadas:i=>estado(i.id)==="aprovada", recusadas:i=>estado(i.id)==="recusada"}, NOME = {novas:"Para avaliar", aprovadas:"Aprovadas", recusadas:"Recusadas"};
  [...$("abas").children].forEach(b => { b.textContent = NOME[b.dataset.v] + " (" + dados.imoveis.filter(SIT[b.dataset.v]).length + ")"; b.setAttribute("aria-pressed", b.dataset.v===aba); });
  mostraEnvio();
  $("count").textContent = n + (n===1 ? " casa encontrada" : " casas encontradas");
  $("sCount").innerHTML = "<b>" + dados.imoveis.length + "</b> casas na base";
  const g = $("grid"); g.innerHTML = "";
  if(!n){ g.innerHTML = '<div class="empty">Nenhuma casa com esses filtros. Aumente o preço ou mostre mais cidades.</div>'; return; }
  for(const i of lista){
    const [locTxt,locCls] = LOC[i.localizacao];
    const el = document.createElement("article"); el.className = "card";
    el.innerHTML = `
      <div class="photo"><div class="none">Sem foto</div><span class="badge ${locCls}"></span><span class="stamp" hidden></span></div>
      <div class="body">
        <div><div class="price"></div><div class="m2"></div></div>
        <div class="where"></div>
        <div class="specs"></div>
        <p class="note"></p>
        <span class="src"></span>
      </div>
      <div class="acts"><button class="act yes" type="button" aria-pressed="false">✓ Aprovar</button><button class="act no" type="button" aria-pressed="false">✕ Recusar</button></div>
      <a class="go" target="_blank" rel="noopener" style="margin:12px 16px 16px"><span>Ver anúncio original</span><span aria-hidden="true">↗</span></a>`;
    el.querySelector(".badge").textContent = locTxt;
    el.querySelector(".price").textContent = brl(i.preco);
    el.querySelector(".m2").textContent = i.area ? brl(Math.round(i.preco/i.area)) + " por m²" : "";
    el.querySelector(".where").innerHTML = ""; const w = el.querySelector(".where"); w.append(i.bairro); const sm = document.createElement("small"); sm.textContent = i.cidade; w.appendChild(sm);
    const sp = el.querySelector(".specs");
    [[i.quartos,i.quartos===1?"quarto":"quartos"],[i.vagas,i.vagas===1?"vaga":"vagas"],[i.area,"m²"]].forEach(([v,t]) => { if(v!=null){ const s=document.createElement("span"); s.className="spec"; s.textContent = v + " " + t; sp.appendChild(s);} });
    if(/confirmar/i.test(i.tipo||"")){ const s=document.createElement("span"); s.className="spec"; s.textContent="Tipo a confirmar"; sp.appendChild(s); }
    el.querySelector(".note").textContent = i.nota_local || "";
    el.querySelector(".src").textContent = i.fonte + (i.anuncio_data ? " · anúncio de " + new Date(i.anuncio_data+"T12:00:00").toLocaleDateString("pt-BR") : "");
    el.querySelector(".go").href = i.url;
    const e = estado(i.id), st = el.querySelector(".stamp");
    if(e){ st.hidden = false; st.textContent = e==="aprovada" ? "Aprovada" : "Recusada"; st.classList.toggle("rec", e==="recusada"); }
    const yes = el.querySelector(".yes"), no = el.querySelector(".no");
    yes.setAttribute("aria-pressed", e==="aprovada"); no.setAttribute("aria-pressed", e==="recusada");
    yes.textContent = e==="aprovada" ? "✓ Aprovada" : "✓ Aprovar"; no.textContent = e==="recusada" ? "Desfazer recusa" : "✕ Recusar";
    yes.onclick = () => decidir(i.id, "aprovada"); no.onclick = () => decidir(i.id, "recusada");
    if(i.imagem){ const im = new Image(); im.alt = "Foto da casa em " + i.bairro; im.loading = "lazy"; im.referrerPolicy = "no-referrer"; im.onload = () => { el.querySelector(".none")?.remove(); }; im.onerror = () => im.remove(); im.src = i.imagem; el.querySelector(".photo").prepend(im); }
    const ph = el.querySelector(".photo"), nf = listaFotos(i).length;
    if(nf > 1){ const c = document.createElement("span"); c.className = "cnt"; c.textContent = "▣ " + nf + " fotos"; ph.appendChild(c); }
    ph.onclick = () => lbAbre(i);
    g.appendChild(el);
  }
}
$("btnPanel").onclick = () => { const p = $("panel"), o = p.classList.toggle("open"); $("btnPanel").setAttribute("aria-expanded", o); };
["preco","ocultarAtencao","soTerreas","ordem"].forEach(id => $(id).addEventListener("input", () => dados && render()));
$("abas").onclick = ev => { const b = ev.target.closest("button"); if(b){ aba = b.dataset.v; render(); } };
carregar();
</script>
