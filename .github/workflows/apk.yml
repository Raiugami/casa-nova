name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, claude/project-thread-dn13fe]
    paths: ["android-app/**", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm install
      - run: npx cap add android
      - name: Compilar
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk casa-nova.apk
          gh release delete apk --cleanup-tag -y || true
          gh release create apk casa-nova.apk --title "App Android (APK)" \
            --notes "O app abre https://raiugami.github.io/casa-nova/ e sempre mostra a versão mais recente do site."
