name: Testar fontes
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script a rodar (testar_fontes.py ou sondar.py)"
        default: "testar_fontes.py"
      args:
        description: "Argumentos (opcional)"
        default: ""
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
        run: python3 "scripts/$SCRIPT" $ARGS
