name: Atualizar anúncios
on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 no horário de Brasília
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/atualizar.py
      - name: Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imoveis.json fotos.json coordenadas.json estacoes.json
          git diff --cached --quiet && exit 0
          git commit -qm "Atualiza anúncios $(date +%F)"
          git pull -q --rebase -X theirs origin main
          git push
      - name: Avisar casas novas
        env:
          GH_TOKEN: ${{ github.token }}
          DONO: ${{ github.repository_owner }}
        run: |
          [ -s novas.md ] || exit 0
          N=$(grep -c '^- ' novas.md)
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$DONO" --title "Casas novas: $N em $(date +%d/%m)" --body-file novas.md
