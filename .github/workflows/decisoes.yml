name: Salvar escolhas de casas
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  salvar:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Escolhas:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar escolhas
        env:
          CORPO: ${{ github.event.issue.body }}
        run: python3 scripts/decisoes.py
      - name: Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase origin main
          git add decisoes.json
          git diff --cached --quiet || (git commit -m "Atualiza escolhas de casas" && git push)
      - name: Fechar o pedido
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "Escolhas salvas. A próxima atualização já respeita as recusas."
